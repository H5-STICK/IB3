
name: Actualizar IB3

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-ib3
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar yt-dlp
        run: python -m pip install --upgrade "yt-dlp[default]"

      - name: Renovar enlaces de IB3
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import urllib.request
          from pathlib import Path

          origen = "https://www.youtube.com/watch?v=_EyRd_Al3mI"

          def obtener(formato):
              resultado = subprocess.check_output(
                  [
                      "yt-dlp",
                      "--no-config",
                      "-f", formato,
                      "-g", origen
                  ],
                  text=True
              )
              urls = [
                  linea.strip()
                  for linea in resultado.splitlines()
                  if linea.strip().startswith("https://")
              ]
              if len(urls) != 1:
                  raise RuntimeError(
                      f"Formato {formato}: URL no encontrada"
                  )
              return urls[0]

          video = obtener("232")
          audio = obtener("234")

          if video == audio:
              raise RuntimeError("Video y audio son iguales")

          for nombre, url in [
              ("VIDEO", video),
              ("AUDIO", audio)
          ]:
              with urllib.request.urlopen(
                  urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  ),
                  timeout=30
              ) as respuesta:
                  contenido = respuesta.read(4096)

                  if respuesta.status != 200:
                      raise RuntimeError(
                          f"{nombre}: HTTP {respuesta.status}"
                      )

                  if not contenido.startswith(b"#EXTM3U"):
                      raise RuntimeError(
                          f"{nombre}: M3U8 no valido"
                      )

                  if b"#EXTINF:" not in contenido:
                      raise RuntimeError(
                          f"{nombre}: sin segmentos"
                      )

                  print(f"{nombre}: HTTP 200, M3U8 correcto")

          playlist = (
              "#EXTM3U\n"
              "#EXT-X-VERSION:6\n"
              '#EXT-X-MEDIA:TYPE=AUDIO,GROUP-ID="audio",'
              'NAME="Español",DEFAULT=YES,'
              f'AUTOSELECT=YES,URI="{audio}"\n'
              "#EXT-X-STREAM-INF:BANDWIDTH=3500000,"
              "RESOLUTION=1280x720,"
              'CODECS="avc1.64001f,mp4a.40.2",'
              'AUDIO="audio"\n'
              f"{video}\n"
          )

          Path("IB3.m3u8").write_text(
              playlist,
              encoding="utf-8"
          )

          print("IB3.m3u8 actualizado")
          PY

      - name: Publicar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add IB3.m3u8

          if git diff --cached --quiet; then
            echo "No hay cambios"
          else
            git commit -m "Renovar enlaces IB3"
            git push
          fi
